[project]
name = "driverepair-desktop"
version = "0.2.2"
description = "Cross-platform drive diagnostics, image rescue, FAT32 undelete and clone-only filesystem repair"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "commstech" }]
keywords = ["disk", "storage", "diagnostic", "recovery", "file-carving"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]

[project.scripts]
driverepair-desktop = "driverepair_desktop.cli:main"
driverepair-gui = "driverepair_desktop.gui:launch"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["driverepair_desktop*"]
