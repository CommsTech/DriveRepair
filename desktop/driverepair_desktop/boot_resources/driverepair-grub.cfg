# DriveRepair recovery ISO - deliberately no hard-drive installer entry.
# live-build substitutes the generated kernel, initrd and boot-argument paths.
set default=0
set timeout=15

menuentry 'DriveRepair - Start recovery workstation (recommended)' --hotkey=s {
    linux @KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE@
    initrd @INITRD_LIVE@
}

menuentry 'DriveRepair - Compatibility graphics (try when display freezes)' --hotkey=c {
    linux @KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE@ nomodeset
    initrd @INITRD_LIVE@
}

menuentry 'DriveRepair - Troubleshooting text console (no desktop)' --hotkey=t {
    linux @KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE@ systemd.unit=multi-user.target
    initrd @INITRD_LIVE@
}

# Live-build may or may not include a UEFI-compatible memtest executable.
if [ -f /boot/grub/memtest.cfg ]; then
    source /boot/grub/memtest.cfg
fi
