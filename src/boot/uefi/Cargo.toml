# UEFI boot crate — experimental / unshipped product path.
# standalone_minimal: splash-only smoke binary (no drive-repair lib).
# drive-repair-uefi: full experimental module graph (Gate 0 fail-closed).

[package]
name = "drive-repair-uefi"
version = "0.1.0"
edition = "2021"
authors = ["commstech"]

[dependencies]
drive-repair = { path = "../../..", features = ["alloc"], default-features = false }
uefi = "0.25"
uefi-services = "0.22"

[[bin]]
name = "drive-repair-uefi-standalone"
path = "standalone_minimal.rs"

[[bin]]
name = "drive-repair-uefi"
path = "main.rs"

[features]
default = ["alloc"]
alloc = []

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
