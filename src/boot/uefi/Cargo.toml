[package]
name = "drive-repair-uefi"
version = "0.1.0"
edition = "2021"
authors = ["DriveRepair Team"]

[dependencies]
drive-repair = { path = "../../..", features = ["alloc"] }
uefi = "0.30"
uefi-services = "0.22"

[[bin]]
name = "drive-repair-uefi"
path = "main.rs"

[[bin]]
name = "drive-repair-uefi-minimal"
path = "minimal.rs"

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

