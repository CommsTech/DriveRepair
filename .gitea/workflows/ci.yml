name: CI/CD Pipeline
on:
  push:
    branches: [ main, develop, 'remediation/**' ]
  pull_request:
    branches: [ main, develop ]

# Gate 0 note: boot ISO build is NOT_PROVEN in CI yet.
# Action refs are commit-SHA pinned (mutable tags rejected by security scanners).
#
# Forge note (git.commsnet.org): keep the required matrix on ubuntu-latest only.
# A broken macos-latest host runner previously failed early and cancelled the
# remaining Linux jobs (default fail-fast), so Clippy looked like the last useful
# gate. Optional multi-OS coverage can return once Node-capable runners exist.

jobs:
  release-hygiene:
    name: Current release metadata and clean source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Ensure active docs and examples match package version
        run: python scripts/check_release_hygiene.py
      - name: Package clean source (reject duplicate/history ZIPs)
        run: python scripts/create_clean_source_archive.py --output "$RUNNER_TEMP/driverepair-source.zip"
      - name: Check source ZIP membership and regression gates
        run: |
          python -m pip install pytest==8.4.2
          cd desktop
          python -m pytest -q tests/test_clean_source_archive.py tests/test_agent_release_gates_20261121.py

  fmt:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy --features "std,alloc" --lib -- -D warnings

  rust-dependencies-audit:
    name: Cargo dependency security audit
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit workspace
        run: cargo audit

  python-lint:
    name: Python linting (ruff)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff==0.13.0
      - name: Ruff check
        working-directory: desktop
        run: ruff check driverepair_desktop/ tests/

  python-security-lint:
    name: Python security linting (bandit)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Install bandit
        run: pip install bandit==1.8.3
      - name: Bandit security scan
        working-directory: desktop
        run: bandit -r driverepair_desktop/ -ll -ii -f json -o bandit-report.json

  python-type-check:
    name: Python type checking (mypy)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Install mypy
        run: pip install mypy==1.15.0
      - name: Mypy type check
        working-directory: desktop
        run: mypy driverepair_desktop/ --ignore-missing-imports --warn-return-any

  python-dependencies-audit:
    name: Python dependency security audit (pip-audit)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit desktop dependencies
        working-directory: desktop
        run: pip-audit --no-deps

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
      - name: Run tests
        run: cargo test --features "std,alloc" --lib

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

  desktop-tests:
    name: Desktop synthetic safety and recovery tests
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest==8.4.2
      - name: Run offline synthetic tests (no real disks)
        working-directory: desktop
        run: python -m pytest -q tests -v

      - name: Run real Tk workflow tests under a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          cd desktop
          xvfb-run -a python -m unittest discover -s tests -p test_gui_workflows.py -v

      - name: Smoke check portable desktop build
        run: python scripts/build_desktop.py --no-wheel

      - name: Build image-first public candidate and verify raw-write deny paths
        run: |
          python scripts/build_desktop.py --public-beta --no-wheel
          VERSION=$(python -c 'from scripts.build_desktop import VERSION; print(VERSION)')
          python scripts/check_public_beta.py "dist/DriveRepair-${VERSION}-public-beta.pyz"

      - name: Portable GUI to recovery engine image test
        run: |
          VERSION=$(python -c 'from scripts.build_desktop import VERSION; print(VERSION)')
          cd desktop
          DRIVEREPAIR_SMOKE_PYZ="../dist/DriveRepair-${VERSION}.pyz" xvfb-run -a python -m unittest discover -s tests -p test_gui_workflows.py -v

  native-recovery-core:
    name: Standalone Rust regular-image rescue core tests
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
      - name: Build standalone Rust core
        run: cargo build --manifest-path rust/recovery-core/Cargo.toml
      - name: Test small image recovery core
        run: cargo test --manifest-path rust/recovery-core/Cargo.toml

  offline-recovery-integrity:
    name: Offline system rescue source and package checks (NO disk I/O)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Validate live-ISO scripts without running them
        run: bash -n scripts/build_live_iso.sh scripts/check_live_iso.sh
      - name: Unit tests for source safety, network mount and mock imaging
        working-directory: desktop
        run: python -m unittest discover -s tests -p 'test_offline_recovery.py' -v
      - name: Verify CLI offline rescue commands are packaged
        run: |
          python scripts/build_desktop.py --no-wheel
          VERSION=$(python -c 'from scripts.build_desktop import VERSION; print(VERSION)')
          python "dist/DriveRepair-${VERSION}.pyz" list-all-linux --help
          python "dist/DriveRepair-${VERSION}.pyz" plan-system-recovery --help
          python "dist/DriveRepair-${VERSION}.pyz" rescue-system --help
