name: CI/CD Pipeline
on:
  push:
    branches: [ main, develop, 'remediation/**' ]
  pull_request:
    branches: [ main, develop ]

# Gate 0 note: boot ISO build is NOT_PROVEN in CI yet.
# Action refs are commit-SHA pinned (mutable tags rejected by security scanners).
#
# Forge note (git.commsnet.org): keep the required matrix on ubuntu-latest only.
# A broken macos-latest host runner previously failed early and cancelled the
# remaining Linux jobs (default fail-fast), so Clippy looked like the last useful
# gate. Optional multi-OS coverage can return once Node-capable runners exist.

jobs:
  fmt:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy --features "std,alloc" --lib -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run tests
        run: cargo test --features "std,alloc" --lib

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

  desktop-tests:
    name: Desktop synthetic safety and recovery tests
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Run offline synthetic tests (no real disks)
        working-directory: desktop
        run: python -m unittest discover -s tests -v

      - name: Run real Tk workflow tests under a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          cd desktop
          xvfb-run -a python -m unittest discover -s tests -p test_gui_workflows.py -v

      - name: Smoke check portable desktop build
        run: python scripts/build_desktop.py --no-wheel

      - name: Portable GUI to recovery engine image test
        working-directory: desktop
        env:
          DRIVEREPAIR_SMOKE_PYZ: ../dist/DriveRepair-0.3.3b12.pyz
        run: xvfb-run -a python -m unittest discover -s tests -p test_gui_workflows.py -v

  native-recovery-core:
    name: Standalone Rust regular-image rescue core tests
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build standalone Rust core
        run: cargo build --manifest-path rust/recovery-core/Cargo.toml
      - name: Test small image recovery core
        run: cargo test --manifest-path rust/recovery-core/Cargo.toml

  offline-recovery-integrity:
    name: Offline system rescue source and package checks (NO disk I/O)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Validate live-ISO scripts without running them
        run: bash -n scripts/build_live_iso.sh scripts/check_live_iso.sh
      - name: Unit tests for source safety, network mount and mock imaging
        working-directory: desktop
        run: python -m unittest discover -s tests -p 'test_offline_recovery.py' -v
      - name: Verify CLI offline rescue commands are packaged
        run: |
          python scripts/build_desktop.py --no-wheel
          python dist/DriveRepair-0.3.3b12.pyz list-all-linux --help
          python dist/DriveRepair-0.3.3b12.pyz plan-system-recovery --help
          python dist/DriveRepair-0.3.3b12.pyz rescue-system --help
