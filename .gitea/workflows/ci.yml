name: CI/CD Pipeline
on:
  push:
    branches: [ main, develop, 'remediation/**' ]
  pull_request:
    branches: [ main, develop ]

# Gate 0 note: boot ISO build is NOT_PROVEN in CI yet.
# Action refs are commit-SHA pinned (mutable tags rejected by security scanners).

jobs:
  fmt:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy --features "std,alloc" --lib -- -D warnings

  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run tests
        run: cargo test --features "std,alloc" --lib

  build:
    name: Build Project
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc, x86_64-apple-darwin]
        exclude:
          - os: ubuntu-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

  desktop-tests:
    name: Desktop synthetic safety and recovery tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Run offline synthetic tests (no real disks)
        working-directory: desktop
        run: python -m unittest discover -s tests -v

      - name: Smoke check portable desktop build
        run: python scripts/build_desktop.py --no-wheel

  native-recovery-core:
    name: Standalone Rust regular-image rescue core tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build standalone Rust core
        run: cargo build --manifest-path rust/recovery-core/Cargo.toml
      - name: Test small image recovery core
        run: cargo test --manifest-path rust/recovery-core/Cargo.toml

  offline-recovery-integrity:
    name: Offline system rescue source and package checks (NO disk I/O)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Validate live-ISO scripts without running them
        run: bash -n scripts/build_live_iso.sh scripts/check_live_iso.sh
      - name: Unit tests for source safety, network mount and mock imaging
        working-directory: desktop
        run: python -m unittest discover -s tests -p 'test_offline_recovery.py' -v
      - name: Verify CLI offline rescue commands are packaged
        run: |
          python scripts/build_desktop.py --no-wheel
          python dist/DriveRepair-0.3.1b1.pyz list-all-linux --help
          python dist/DriveRepair-0.3.1b1.pyz plan-system-recovery --help
          python dist/DriveRepair-0.3.1b1.pyz rescue-system --help
