[package]
name = "driverepair-recovery-core"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Small dependency-free Rust image rescue core; regular files only"

[[bin]]
name = "driverepair-recovery-core"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
